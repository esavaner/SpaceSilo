name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spacesilo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d spacesilo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/spacesilo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @repo/shared exec prisma validate
      - run: pnpm --filter @repo/shared exec prisma migrate deploy
      - run: pnpm --filter @repo/shared exec prisma migrate diff --from-config-datasource --to-schema src/prisma/schema.prisma --exit-code
      - run: pnpm --filter @repo/core test
