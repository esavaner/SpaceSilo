services:
  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FILES_PATH: /data/files
      STORAGE_PATH: /data/storage
      APPDATA_PATH: /data/appdata
    volumes:
      - type: bind
        source: ${FILES_PATH:?FILES_PATH is required}
        target: /data/files
      - type: bind
        source: ${STORAGE_PATH:?STORAGE_PATH is required}
        target: /data/storage
      - type: bind
        source: ${APPDATA_PATH:?APPDATA_PATH is required}
        target: /data/appdata
    expose:
      - "3100"

  web:
    build:
      context: .
      dockerfile: apps/native/Dockerfile
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "${WEB_PORT:-80}:80"
